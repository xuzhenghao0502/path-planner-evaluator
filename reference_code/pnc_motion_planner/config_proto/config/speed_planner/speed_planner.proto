syntax = "proto2";

package gpal.pnc.planning;

message SpeedPlannerConfig {

  optional double max_speed_limit = 1 [default = 60];
  optional double a_hard_upper_bound = 2 [default = 2.0];
  optional double a_hard_lower_bound = 3 [default = -6.0];
  optional double j_hard_upper_bound = 4 [default = 2.0];
  optional double j_hard_lower_bound = 5 [default = -10.0];
  optional double follow_time_gap = 6 [default = 1.5];
  optional double lateral_a_limit = 7 [default = 1.0];
  optional double dacc_coefficient = 8 [default = 0.6];

  optional double destination_stop_distance = 9 [default = 0.0];
  optional double destination_stop_buffer = 10 [default = 0.5];
  optional double tfl_stop_distance = 11 [default = 1.0];
  optional double tfl_stop_buffer = 12 [default = 1.0];
  optional double obs_stop_distance = 13 [default = 5.0];
  optional double obs_stop_buffer = 14 [default = 3.0]; 

  optional bool enable_local_path_od_check = 51 [default = false];
  optional double local_path_check_time_horizon = 52 [default = 3.0];
  optional double local_path_boundary_safe_dis = 53 [default = 2.0];
  optional double local_path_boundary_expand_s_threshold = 54 [default = 3.0];

  optional bool use_risk_speed_planner = 100 [default = false];
  optional bool enable_parking_od_check = 101 [default = false];

  optional bool use_const_park_speed = 102 [default = false];
  optional bool use_empirical_park_speed = 103 [default = false];   // const 与 empirical 模式不可同时开启
}
