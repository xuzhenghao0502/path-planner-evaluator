syntax = "proto2";

package gpal.pnc.planning;

message SpeedPreProcessorConfig {

    optional double u_turn_speed_limit = 1 [default = 7.0];
    optional double turn_speed_limit = 2 [default = 13.0];
    optional double lstp_speed_limit = 3 [default = 7.0];
    optional double parking_speed_limit = 4 [default = 3.0];

    optional double tfl_stop_buffer = 5 [default = 1.0];
    optional bool allow_exceed_stop_line = 6 [default = false];

    optional double lateral_acc_limit_for_radius_1000 = 9 [default = 1.2]; // 
    optional double lateral_acc_limit_for_radius_500 = 10 [default = 0.7]; // 
    optional double lateral_acc_limit_for_radius_250 = 11 [default = 0.5]; // 
    optional double lateral_acc_limit_for_radius_100 = 12 [default = 0.45]; // 
    optional double lateral_acc_limit_for_radius_50 = 13 [default = 0.4]; // 
    optional double lateral_acc_limit_for_radius_20 = 14 [default = 0.68]; // 
    optional double lateral_acc_limit_for_radius_10 = 15 [default = 0.65]; // 
    optional double min_curve_speed_limit = 16 [default = 10.0]; // 

    optional double out_curve_consider_back_distance = 17 [default = 15.0]; // 
    optional double out_curve_consider_curve_threshold = 18 [default = 0.015]; // 
    optional double steer_acc_limit_threshold = 19 [default = 10.0];
    optional double release_steer_acc_limit_threshold = 20 [default = 4.0];
    optional double overspeed_min_acc_limit_threshold = 21 [default = -0.2];

    optional bool enable_turn_speed_limit = 101 [default = true];
    optional bool enable_u_turn_stop = 102 [default = true];
    optional bool enable_decision_speed_limit = 103 [default = true];
    optional bool enable_map_speed_limit = 104 [default = true];
    optional bool enable_turn_accelerate_limit = 105 [default = false];

}
