syntax = "proto2";

package gpal.pnc.planning;

message SpeedOcpQpOptimizerConfig {
    optional int32 use_risk_field_info = 1 [default = 0];

    optional double comfort_jerk_for_stagger_driving = 2 [default = -2.0];
    optional double comfort_decc_for_stagger_driving = 3 [default = -1.0];
    optional double min_stagger_driving_speed = 4 [default = 10.0]; // KMH
    optional double stagger_delta_s = 5 [default = 10.0]; // meters

    optional double thw_min = 6 [default = 1.1];
    optional double thw_low = 7 [default = 1.3];
    optional double thw_mid = 8 [default = 1.5];
    optional double thw_high = 9 [default = 1.7];
    optional double thw_max = 10 [default = 1.9];
    optional double decision_thw_threshold = 11 [default = 0.5];

    optional double min_overtake_safe_distance = 12 [default = 3.0];


    optional bool enable_stagger_driving = 101 [default = false];
    optional bool enable_speed_risk_model = 102 [default = false];
    optional bool enable_merge_special_case = 103 [default = false];
}
