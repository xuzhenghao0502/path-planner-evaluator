syntax = "proto2";

package gpal.pnc.planning;
import "config/path_bound_parser/path_bound_points_config.proto";

message RealTimePathPlannerConfig {
  // enable nudge
  optional bool enable_nudge = 1 [default = false];
  optional bool enable_static_nudge = 2 [default = false];
  optional bool enable_dynamic_nudge = 3 [default = false];
  optional bool enable_risky_nudge = 4 [default = false];
  optional bool enable_nearby_nudge = 5 [default = false];
  optional bool restrict_bound_in_lane = 6 [default = false]; 
  optional bool enable_freespace_nudge = 7 [default = false];
  optional int32 timeout_ms = 8 [default = 20];

  optional bool enable_local_path_when_path_too_far = 20 [default = false];
  optional double min_refine_length = 21 [default = 10.0];
  optional double heading_thrd_not_refine_path = 22 [default = 15.0]; // degree
  optional double l_thrd_not_refine_path = 23 [default = 0.6];
  optional double force_tail_length = 24 [default = 20.0];
  optional bool reset_plan_start_point_with_loc_heading_when_stop = 25 [default = false];
  optional bool enable_solved_path_validity_check = 26 [default = false];

  // for special scene
  optional bool enable_refine_boundary_under_special_scene = 81 [default = false];
  optional double enter_curve_scene_kappa_threshold = 82 [default = 0.01];
  optional double exit_curve_scene_kappa_threshold = 83 [default = 0.005];
  optional double curve_scene_soft_bound_shift = 84 [default = 0.4];
  optional double dest_scene_permited_soft_bound = 85 [default = 0.5];
  optional double ending_distance = 86 [default = 30.0];
  optional double narrow_scene_soft_bound_shift = 87 [default = 0.5];
  optional double narrow_scene_barrier_bound_interval = 88 [default = 2.0]; 

  optional float lane_keep_start_time = 100 [default = 7.0];
  optional float lane_change_time_lower = 101 [default = 3.0];
  optional float lane_change_time_upper = 102 [default = 5.5];
  optional float lane_change_velocity_lower = 103 [default = 8.0];
  optional float lane_change_velocity_upper = 104 [default = 23.0];
  optional bool enable_adaptive_lane_change_time = 105 [default = false];
  optional float lane_keep_lat_acc = 106 [default = 0.3];
  
  
  optional bool enable_fs_collision_check = 111 [default = false];
  optional double collision_check_buffer = 112 [default = 0.0];
  optional double corner_width = 113 [default = 0.0];
  optional bool enable_curve_decide_process = 114 [default = false];
  optional double curve_kappa_thresold = 115 [default = 0.0];
  optional double curve_look_ahead_distance = 116 [default = 0.0];
  optional double side_box_length = 117 [default = 0.0];
  optional double side_box_width = 118 [default = 0.0];

  optional bool enable_polyline_boundary = 130[default = false];

  optional PathBoundPointsConfig path_bound_points_config = 140;
}
