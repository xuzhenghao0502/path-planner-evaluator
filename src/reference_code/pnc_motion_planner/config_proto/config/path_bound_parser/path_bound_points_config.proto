syntax = "proto2";

package gpal.pnc.planning;

message PathBoundPointsConfig {

  enum ObjectType {
    UNKNOWN = 0;
    PEDESTRIAN = 1;
    VRU = 2; // non-motor vehicle, including bicycle, etc.
    VEHICLE = 3; // motor vehicle, including car, motorcycle, etc.
    HEAVY_VEHICLE = 4;
  }

  message ObstacleInfo {
    optional double barrier_lateral_safe_distance = 1 [default = 0.0];
    optional double soft_lateral_safe_distance = 2 [default = 0.0];
    optional double coff_a = 3 [default = 0.0];
    optional double coff_b = 4 [default = 0.0];
    optional double coff_c_min = 5 [default = 0.0];
    optional double lateral_safe_distance = 6 [default = 0.0];
  }

  message TypeLateralDistPair {
    optional ObjectType obs_type = 1;
    optional ObstacleInfo obs_info = 2;
  }

  message TypeLateralDistPairs {
    repeated TypeLateralDistPair type_lateral_dist_pair = 1;
  }

  optional int32 horizon = 1 [default = 50];
  optional double resolution = 2 [default = 4.0];

  optional double max_road_width_left = 21 [default = 20.0];
  optional double max_road_width_right = 22 [default = 20.0];
  optional double max_lane_width_left = 23 [default = 1.875];
  optional double max_lane_width_right = 24 [default = 1.875];
  optional double barrier_bound_extend_buffer = 25 [default = 0.0];
  optional double barrier_bound_extend_buffer_for_physically_impassable = 26 [default = 0.2];

  optional float bound_ignore_rear_buffer = 27 [default = 2.0];
  optional float bound_ignore_front_buffer = 28 [default = 10.0];

  optional TypeLateralDistPairs type_lateral_dist_pairs = 31;
  optional bool enable_lateral_buffer_use_obs_type = 32 [default = false];
  optional bool enable_lateral_buffer_use_obs_speed = 33 [default = false];

  // for static obs
  optional double default_max_barrier_lateral_buffer_for_obs = 41 [default = 0.0];
  optional double default_min_barrier_lateral_buffer_for_obs = 42 [default = 0.0];
  optional double default_max_soft_lateral_buffer_for_obs = 43 [default = 0.0];
  optional double default_min_soft_lateral_buffer_for_obs = 44 [default = 0.0];
  optional double barrier_start_long_buffer_for_obs = 45 [default = 1.0];
  optional double barrier_end_long_buffer_for_obs = 46 [default = 1.0];
  optional double soft_start_long_buffer_for_obs = 47 [default = 5.0];
  optional double soft_end_long_buffer_for_obs = 48 [default = 5.0];
  optional double max_speed_limit = 49 [default = 130.0]; //km/h

  // for dynamic obs
  optional double adc_t_range = 50 [default = 8.0];
  optional double default_barrier_lateral_buffer_for_dynamic_obs = 51 [default = 0.0];  // 动态nudge不推硬边界，必须为0，但接口保留
  optional double default_soft_lateral_buffer_for_dynamic_obs = 52 [default = 0.0];
  optional double soft_start_long_buffer_for_dynamic_obs = 53 [default = 5.0];
  optional double soft_start_long_pre_time_for_dynamic_obs = 54 [default = 0.0];
  optional double soft_end_long_buffer_for_dynamic_obs = 55 [default = 5.0];
  optional double soft_end_long_pre_time_for_dynamic_obs = 56 [default = 0.0];
  optional double hysteresis_delta_veloc_threshold = 57 [default = 0.0];
  optional double hysteresis_delta_veloc_buffer = 58 [default = 1.0];

  // for freespace
  optional double default_barrier_lateral_buffer_for_fs = 61 [default = 0.0];
  optional double default_soft_lateral_buffer_for_fs = 62 [default = 0.0];
  optional double barrier_start_long_buffer_for_fs = 63 [default = 1.0];
  optional double barrier_end_long_buffer_for_fs = 64 [default = 1.0];
  optional double soft_start_long_buffer_for_fs = 65 [default = 5.0];
  optional double soft_end_long_buffer_for_fs = 66 [default = 5.0];
  optional double soft_lateral_buffer_coefs_for_fs = 67 [default = 2.0];

  // filter
  optional double fs_filter_in = 71 [default = 1.0];
  optional double fs_filter_out = 72 [default = 1.0];
  optional double od_filter_in = 73 [default = 1.0];
  optional double od_filter_out = 74 [default = 1.0];
  optional double prior_physical_filter_in = 75 [default = 1.0];
  optional double prior_physical_filter_out = 76 [default = 1.0];

  // for search
  optional double search_radius = 90 [default = 0.5];
  optional double search_step = 91 [default = 0.2];

    message SpeedDecisionBoundBufferMap {
    message Element {
      optional double speed = 1;
      optional double buffer = 2;
    }
    repeated Element elements = 1;
  }
  optional SpeedDecisionBoundBufferMap speed_decision_bound_buffer_map = 100;

  message SpeedLongitBoundBufferMap {
  message Element {
      optional double speed = 1;
      optional double start_buffer = 2;
      optional double end_buffer = 3;
    }
    repeated Element elements = 1;
  }
  optional SpeedLongitBoundBufferMap speed_longit_bound_buffer_map = 110;

  optional ObstacleInfo fs_info = 160;
}
